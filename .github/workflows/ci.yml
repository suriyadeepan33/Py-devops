name: Py_devops CI/CD Pipeline - Docker Hub and Kubernetes

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t py-devops:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            suriyadeepan22/py-devops:latest
            suriyadeepan22/py-devops:${{ github.sha }}

  deploy-to-minikube:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Remove previous health-check Job
        run: kubectl delete job disk-health-check --ignore-not-found=true

      - name: Deploy health-check Job
        run: kubectl apply -f k8s/job.yaml

      - name: Wait for Job completion
        run: kubectl wait --for=condition=complete job/disk-health-check --timeout=180s

      - name: Display health-check results
        run: kubectl logs job/disk-health-check
